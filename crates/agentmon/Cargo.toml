[package]
name = "agentmon"
version = "0.2.3"
edition.workspace = true

[[bin]]
name = "agentmon"
path = "src/main.rs"

[lib]
name = "agentmon"
path = "src/lib.rs"

[dependencies]
agentmon-proto = { path = "../agentmon-proto" }
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
agentd = { path = "../agentd" }
